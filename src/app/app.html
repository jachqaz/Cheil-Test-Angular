<div class="min-h-full flex flex-col">
  <header class="bg-brand-600 text-white shadow">
    <nav class="mx-auto max-w-6xl px-4 py-3 flex items-center justify-between">
      <a routerLink="/" class="flex items-center gap-2 font-bold text-lg">
        <span class="inline-grid place-items-center w-8 h-8 rounded-lg bg-white/20">🏨</span>
        Cheil Hoteles
      </a>
      <div class="flex items-center gap-1 text-sm">
        <a
          routerLink="/"
          routerLinkActive="bg-white/20"
          [routerLinkActiveOptions]="{ exact: true }"
          class="px-3 py-2 rounded-lg hover:bg-white/10 transition"
          >Inicio</a
        >
        <a
          routerLink="/admin"
          routerLinkActive="bg-white/20"
          class="px-3 py-2 rounded-lg hover:bg-white/10 transition"
          >Administración</a
        >
      </div>
    </nav>
  </header>

  <main class="flex-1 mx-auto w-full max-w-6xl px-4 py-6">
    <router-outlet />
  </main>

  <footer class="border-t border-slate-200 py-4 text-center text-xs text-slate-500">
    Cheil Hoteles · Prueba técnica NTS
  </footer>
</div>
